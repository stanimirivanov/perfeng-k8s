name: Validate Kubernetes deployment configuration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-definitions:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.1.4
      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --version=4.4.1 --no-progress --yes
      - name: Report toolchain
        run: make doctor
      - name: Run repository-local verification
        run: make verify

  runtime-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the pinned registry validator
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-control-plane
          ref: 403e2f2dd0c07854593020b6f8da4979d808b21d
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: .validation/perfeng-control-plane
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .validation/perfeng-control-plane/go.mod
          cache-dependency-path: .validation/perfeng-control-plane/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Validate fixtures and deployable bundles with the runtime loader
        run: make runtime-registry CONTROL_PLANE_ROOT=.validation/perfeng-control-plane

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Audit locked dependencies
        run: make supply-chain
