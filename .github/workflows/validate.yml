name: Validate Kubernetes deployment configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark-definitions:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python -m scripts.validate

  runtime-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the pinned registry validator
        uses: actions/checkout@v4
        with:
          repository: stanimirivanov/perfeng-control-plane
          ref: fa34807de32d1fb6d625ab76d2954e554a76b72a
          path: .validation/perfeng-control-plane
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .validation/perfeng-control-plane/go.mod
          cache-dependency-path: .validation/perfeng-control-plane/go.sum
      - name: Validate the repository fixture with the runtime loader
        working-directory: .validation/perfeng-control-plane
        run: >-
          go run ./cmd/validate-registry
          -root "${{ github.workspace }}/testdata/runtime-registry"
          -manifest registry.json
