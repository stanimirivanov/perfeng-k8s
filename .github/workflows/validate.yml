name: Validate Kubernetes deployment configuration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-definitions:
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.1.4
      - name: Install kubectl for offline Kustomize rendering
        uses: azure/setup-kubectl@v5.2.0
        with:
          version: v1.36.4
      - name: Report toolchain
        run: make doctor
      - name: Run repository-local verification
        run: make verify

  runtime-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the pinned registry validator
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-control-plane
          ref: 703d9d11fda3f94e52b4cf4fad749d73cf52247f
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: .validation/perfeng-control-plane
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: .validation/perfeng-control-plane/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Validate fixtures and deployable bundles with the runtime loader
        run: make runtime-registry CONTROL_PLANE_ROOT=.validation/perfeng-control-plane

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Audit locked dependencies
        run: make supply-chain
