name: Build and optionally publish contained kube-burner

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, 'execution/**', 'scripts/**', 'contracts/**', 'toolchain/**', 'tests/**', pyproject.toml, uv.lock, .github/workflows/image.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the reviewed Helm toolchain for offline chart tests
        uses: azure/setup-helm@v5
        with:
          version: v4.1.4
      - name: Reject publication outside main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: exit 1
      - name: Verify repository-local execution and publisher tests
        run: uv run --locked python -m unittest tests.test_contained -v
      - name: Build Linux AMD64 image
        run: docker build --platform linux/amd64 --build-arg VCS_REF="$GITHUB_SHA" -t "ghcr.io/stanimirivanov/perfeng-kube-burner:$GITHUB_SHA" .
      - name: Verify non-root, read-only image and pinned executable
        shell: bash
        run: |
          image="ghcr.io/stanimirivanov/perfeng-kube-burner:$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '65532:65532'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          docker run --rm --read-only --network none "$image" --help
          docker run --rm --read-only --network none --entrypoint python "$image" -c 'import hashlib; from scripts.contained_run import EXECUTABLE, EXECUTABLE_SHA256; binary=EXECUTABLE.open("rb"); assert hashlib.file_digest(binary,"sha256").hexdigest()==EXECUTABLE_SHA256; binary.close()'
          docker run --rm --read-only --network none --entrypoint /usr/local/bin/kube-burner "$image" version
      - name: Publish and verify registry artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          image="ghcr.io/stanimirivanov/perfeng-kube-burner:$GITHUB_SHA"
          docker push "$image"
          docker pull "$image"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          [[ "$digest" =~ ^ghcr.io/stanimirivanov/perfeng-kube-burner@sha256:[a-f0-9]{64}$ ]]
          docker pull "$digest"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$digest")" = 'linux/amd64'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$digest")" = "$GITHUB_SHA"
          docker run --rm --read-only --network none "$digest" --help
          printf 'Verified kube-burner image: `%s`\n\nSource revision: `%s`\n\nPlatform: linux/amd64\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
