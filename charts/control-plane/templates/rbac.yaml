apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-job-controller
  namespace: {{ required "executionNamespace is required" .Values.executionNamespace }}
  labels:
    app.kubernetes.io/name: perfeng-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-job-controller
  namespace: {{ required "executionNamespace is required" .Values.executionNamespace }}
  labels:
    app.kubernetes.io/name: perfeng-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-job-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
