apiVersion: v1
kind: Pod
metadata:
  name: perfeng-pod-startup-{{.Iteration}}
  labels:
    perfeng.io/benchmark: pod-startup
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: pause
      image: "{{.containerImage}}"
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 1m
          memory: 1Mi
        limits:
          cpu: 10m
          memory: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
